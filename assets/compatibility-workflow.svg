<svg width="1100" height="520" viewBox="0 0 1100 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Local AI compatibility workflow</title>
  <desc id="desc">Workflow showing how a machine profile becomes RAM-aware model recommendations through LocalClaw metadata.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#161616"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#ff453a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1100" height="520" rx="28" fill="#050505"/>
  <rect width="1100" height="520" rx="28" fill="url(#panel)" opacity=".72"/>
  <path d="M0 88H1100M0 216H1100M0 344H1100M0 472H1100M122 0V520M366 0V520M610 0V520M854 0V520" stroke="#fff" stroke-opacity=".045"/>
  <text x="54" y="72" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-1.2">Compatibility workflow</text>
  <text x="54" y="106" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800">from hardware reality to local model fit</text>

  <g transform="translate(58 168)">
    <rect width="220" height="190" rx="24" fill="#0b0b0b" stroke="#3f3f46"/>
    <circle cx="38" cy="38" r="12" fill="#22c55e"/>
    <text x="62" y="45" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="900">Machine</text>
    <text x="32" y="88" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="16">Mac mini M4</text>
    <text x="32" y="116" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800">16 GB unified RAM</text>
    <text x="32" y="144" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800">Apple Silicon</text>
  </g>

  <path d="M296 263H386" stroke="#ff453a" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(406 168)">
    <rect width="220" height="190" rx="24" fill="#0b0b0b" stroke="#ff453a" stroke-opacity=".55"/>
    <circle cx="38" cy="38" r="12" fill="#ff453a"/>
    <text x="62" y="45" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="900">Fit filters</text>
    <text x="32" y="88" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="16">min_ram_gb ≤ 16</text>
    <text x="32" y="116" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800">Q4 / Q5 quantization</text>
    <text x="32" y="144" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800">use case tags</text>
  </g>

  <path d="M644 263H734" stroke="#ff453a" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(754 168)">
    <rect width="288" height="190" rx="24" fill="#0b0b0b" stroke="#a78bfa" stroke-opacity=".55"/>
    <circle cx="38" cy="38" r="12" fill="#a78bfa"/>
    <text x="62" y="45" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="900">Local picks</text>
    <text x="32" y="88" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="16">Qwen, GLM, Phi, Granite...</text>
    <text x="32" y="116" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800">scores + install metadata</text>
    <text x="32" y="144" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800">links to model pages</text>
  </g>

  <g transform="translate(58 406)">
    <rect width="984" height="54" rx="16" fill="#101010" stroke="#3f3f46"/>
    <text x="24" y="34" fill="#ff453a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="900">principle:</text>
    <text x="128" y="34" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">fit before hype • RAM before leaderboard • installability before raw size</text>
  </g>
</svg>
