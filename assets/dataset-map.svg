<svg width="1100" height="520" viewBox="0 0 1100 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dataset map</title>
  <desc id="desc">Clear map of the Open Local AI Database datasets: LLMs, speech models, machines and exports.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#161616"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <pattern id="grid" width="84" height="84" patternUnits="userSpaceOnUse">
      <path d="M84 0H0V84" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1100" height="520" rx="28" fill="#050505"/>
  <rect width="1100" height="520" rx="28" fill="url(#grid)"/>

  <text x="56" y="72" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="950" letter-spacing="-1.2">Dataset map</text>
  <text x="56" y="106" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800">JSON + CSV + schemas for local AI compatibility</text>

  <g transform="translate(56 154)">
    <rect width="306" height="236" rx="24" fill="url(#panel)" stroke="#ff453a" stroke-opacity=".58"/>
    <circle cx="32" cy="36" r="9" fill="#ff453a"/>
    <text x="54" y="45" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="950">LLMs</text>
    <text x="32" y="96" fill="#ff453a" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="950">188</text>
    <text x="32" y="126" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="850">records</text>
    <text x="32" y="164" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">RAM tiers, quantization,</text>
    <text x="32" y="190" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">LM Studio refs and scores.</text>
    <rect x="32" y="206" width="118" height="30" rx="15" fill="#ff453a" fill-opacity=".12" stroke="#ff453a" stroke-opacity=".46"/>
    <text x="54" y="226" fill="#ff8a64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="900">llms.json</text>
  </g>

  <g transform="translate(397 154)">
    <rect width="306" height="236" rx="24" fill="url(#panel)" stroke="#a78bfa" stroke-opacity=".58"/>
    <circle cx="32" cy="36" r="9" fill="#a78bfa"/>
    <text x="54" y="45" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="950">Speech</text>
    <text x="32" y="96" fill="#a78bfa" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="950">57</text>
    <text x="32" y="126" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="850">TTS / ASR</text>
    <text x="32" y="164" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">Languages, latency,</text>
    <text x="32" y="190" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">formats and licenses.</text>
    <rect x="32" y="206" width="108" height="30" rx="15" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".46"/>
    <text x="55" y="226" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="900">tts.json</text>
  </g>

  <g transform="translate(738 154)">
    <rect width="306" height="236" rx="24" fill="url(#panel)" stroke="#22c55e" stroke-opacity=".54"/>
    <circle cx="32" cy="36" r="9" fill="#22c55e"/>
    <text x="54" y="45" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="950">Machines</text>
    <text x="32" y="96" fill="#22c55e" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="950">15</text>
    <text x="32" y="126" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="850">profiles</text>
    <text x="32" y="164" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">Apple Silicon and</text>
    <text x="32" y="190" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">NVIDIA local AI rigs.</text>
    <rect x="32" y="206" width="142" height="30" rx="15" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".46"/>
    <text x="52" y="226" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="900">machines.json</text>
  </g>

  <g transform="translate(56 428)">
    <rect width="988" height="54" rx="17" fill="#101010" stroke="#3f3f46"/>
    <text x="24" y="34" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="900">Exports</text>
    <text x="104" y="34" fill="#d4d4d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800">JSON / CSV / schemas / examples / validation</text>
  </g>
</svg>
