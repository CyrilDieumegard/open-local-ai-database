<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Open Local AI Database cover</title>
  <desc id="desc">A dark LocalClaw branded cover showing local LLMs, speech models and machines connected into one open database.</desc>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 120) rotate(50) scale(620 380)">
      <stop stop-color="#ff453a" stop-opacity=".34"/>
      <stop offset=".45" stop-color="#ea580c" stop-opacity=".12"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 440) scale(360 240)">
      <stop stop-color="#22c55e" stop-opacity=".22"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#18181b"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#050505"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#greenGlow)"/>

  <g transform="translate(88 72)">
    <rect x="0" y="0" width="74" height="74" rx="18" fill="url(#panel)" stroke="#ff453a" stroke-opacity=".5"/>
    <rect x="9" y="9" width="56" height="56" rx="14" fill="#ea580c"/>
    <path d="M37 20c-7.5 0-13.6 5.8-13.6 13 0 3.5 1.5 6.8 3.9 9.2l-5.8 5.8 5.4 5.4 6-6c1.3.4 2.7.6 4.1.6s2.8-.2 4.1-.6l6 6 5.4-5.4-5.8-5.8c2.4-2.4 3.9-5.7 3.9-9.2 0-7.2-6.1-13-13.6-13Zm-5.7 14.5a3.8 3.8 0 1 1 0-7.6 3.8 3.8 0 0 1 0 7.6Zm11.4 0a3.8 3.8 0 1 1 0-7.6 3.8 3.8 0 0 1 0 7.6Z" fill="#fff"/>
    <text x="94" y="31" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">LocalClaw</text>
    <text x="94" y="58" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">open data for practical local AI</text>
  </g>

  <g transform="translate(88 204)">
    <text fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="900" letter-spacing="-3">
      <tspan x="0" y="0">Open Local AI</tspan>
      <tspan x="0" y="82" fill="#ff453a">Database</tspan>
    </text>
    <text x="0" y="132" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">
      Local LLMs, speech models and hardware fit metadata.
    </text>
    <text x="0" y="168" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">
      RAM fit • quantization • LM Studio refs • Apple Silicon • NVIDIA
    </text>
  </g>

  <g transform="translate(88 486)">
    <rect width="188" height="66" rx="16" fill="#101010" stroke="#3f3f46"/>
    <text x="24" y="30" fill="#ff453a" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">188</text>
    <text x="24" y="51" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="800">LLM records</text>
    <rect x="206" width="188" height="66" rx="16" fill="#101010" stroke="#3f3f46"/>
    <text x="230" y="30" fill="#a78bfa" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">57</text>
    <text x="230" y="51" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="800">speech models</text>
    <rect x="412" width="188" height="66" rx="16" fill="#101010" stroke="#3f3f46"/>
    <text x="436" y="30" fill="#22c55e" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">15</text>
    <text x="436" y="51" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="800">machines</text>
  </g>

  <g transform="translate(770 126)" filter="url(#softShadow)">
    <rect width="390" height="382" rx="28" fill="#0b0b0b" stroke="#333"/>
    <rect x="24" y="24" width="342" height="72" rx="18" fill="#141414" stroke="#2f2f35"/>
    <circle cx="52" cy="60" r="7" fill="#ff453a"/>
    <text x="76" y="55" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850">machine profile</text>
    <text x="76" y="78" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">Mac mini M4 • 16 GB</text>
    <path d="M194 112V145" stroke="#3f3f46" stroke-width="2"/>
    <rect x="24" y="146" width="342" height="78" rx="18" fill="#111" stroke="#3f3f46"/>
    <text x="48" y="178" fill="#22c55e" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850">RAM-aware fit</text>
    <text x="48" y="202" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">min_ram_gb ≤ 16</text>
    <path d="M194 224V257" stroke="#3f3f46" stroke-width="2"/>
    <rect x="24" y="258" width="342" height="98" rx="18" fill="#141414" stroke="#ff453a" stroke-opacity=".58"/>
    <text x="48" y="292" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850">Qwen / GLM / Phi picks</text>
    <text x="48" y="318" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">Q4_K_M • local install • page URLs</text>
  </g>
</svg>
