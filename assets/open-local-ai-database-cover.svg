<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Open Local AI Database cover</title>
  <desc id="desc">A clean LocalClaw branded banner for the Open Local AI Database, showing the three datasets and their purpose.</desc>
  <defs>
    <radialGradient id="orangeGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(270 120) scale(520 320)">
      <stop stop-color="#ff453a" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#ea580c" stop-opacity=".10"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 410) scale(360 190)">
      <stop stop-color="#22c55e" stop-opacity=".16"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171717"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="520" rx="28" fill="#050505"/>
  <rect width="1280" height="520" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="520" rx="28" fill="url(#orangeGlow)"/>
  <rect width="1280" height="520" rx="28" fill="url(#greenGlow)"/>

  <g transform="translate(82 58)">
    <rect width="66" height="66" rx="17" fill="#ea580c"/>
    <path d="M33 18c-7 0-12.8 5.4-12.8 12.2 0 3.3 1.4 6.3 3.7 8.6l-5.4 5.4 5.1 5.1 5.6-5.6c1.2.3 2.5.5 3.8.5s2.6-.2 3.8-.5l5.6 5.6 5.1-5.1-5.4-5.4c2.3-2.3 3.7-5.3 3.7-8.6C45.8 23.4 40 18 33 18Zm-5.3 13.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm10.6 0a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" fill="#fff"/>
    <text x="88" y="29" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="850">LocalClaw</text>
    <text x="88" y="56" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="750">open data for practical local AI</text>
  </g>

  <g transform="translate(82 174)">
    <text fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="950" letter-spacing="-2.2">
      <tspan x="0" y="0">Open Local AI</tspan>
      <tspan x="0" y="76" fill="#ff453a">Database</tspan>
    </text>
    <text x="0" y="122" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="600">Local model, speech and hardware metadata.</text>
    <text x="0" y="158" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">RAM fit / quantization / LM Studio refs</text>
  </g>

  <g transform="translate(760 94)">
    <rect width="374" height="74" rx="20" fill="url(#card)" stroke="#ff453a" stroke-opacity=".48"/>
    <text x="28" y="34" fill="#ff453a" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="950">188</text>
    <text x="96" y="31" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850">Local LLM records</text>
    <text x="96" y="54" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="750">RAM tiers, quantization, scores</text>

    <rect y="104" width="374" height="74" rx="20" fill="url(#card)" stroke="#a78bfa" stroke-opacity=".48"/>
    <text x="28" y="138" fill="#a78bfa" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="950">57</text>
    <text x="96" y="135" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850">Speech models</text>
    <text x="96" y="158" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="750">TTS, ASR, voice workflows</text>

    <rect y="208" width="374" height="74" rx="20" fill="url(#card)" stroke="#22c55e" stroke-opacity=".48"/>
    <text x="28" y="242" fill="#22c55e" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="950">15</text>
    <text x="96" y="239" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850">Machine profiles</text>
    <text x="96" y="262" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="750">Apple Silicon and NVIDIA</text>
  </g>

  <g transform="translate(82 424)">
    <rect width="1052" height="52" rx="16" fill="#101010" stroke="#3f3f46"/>
    <text x="24" y="33" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="850">Built for one question:</text>
    <text x="222" y="33" fill="#d4d4d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800">what can this machine actually run locally?</text>
  </g>
</svg>
